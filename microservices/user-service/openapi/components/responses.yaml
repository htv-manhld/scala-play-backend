      schema:
        $ref: './schemas.yaml#/UserSuccessResponse'

UsersSuccessResponse:
  description: Users retrieved successfully
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/UsersSuccessResponse'

PaginatedUsersResponse:
  description: Users retrieved successfully with pagination
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/PaginatedUsersResponse'

UserCreatedResponse:
  description: User created successfully
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/UserSuccessResponse'

UserDeletedResponse:
  description: User deleted successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            examples:
              - true
