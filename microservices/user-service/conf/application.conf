# User Service Configuration
play.application.secret="your-application-secret-key-must-be-at-least-sixty-four-characters-long-for-security"
play.application.secret=${?APPLICATION_SECRET}
play.environment="dev"
play.environment=${?PLAY_ENV}
play.http.secret.key="your-application-secret-key-must-be-at-least-sixty-four-characters-long-for-security"
play.http.secret.key=${?APPLICATION_SECRET}

# HTTP configuration
play.server.http.port=9001
play.server.http.port=${?HTTP_PORT}
play.server.http.address="0.0.0.0"

# Database configuration
slick.dbs.default.profile="slick.jdbc.PostgresProfile$"
slick.dbs.default.db.driver="org.postgresql.Driver"
slick.dbs.default.db.url="jdbc:postgresql://user-db:5432/userdb"
slick.dbs.default.db.url=${?DB_URL}
slick.dbs.default.db.user="postgres"
slick.dbs.default.db.user=${?DB_USER}
slick.dbs.default.db.password="password"
slick.dbs.default.db.password=${?DB_PASSWORD}
slick.dbs.default.db.numThreads=10
slick.dbs.default.db.numThreads=${?DB_NUM_THREADS}
slick.dbs.default.db.maxConnections=10
slick.dbs.default.db.maxConnections=${?DB_MAX_CONNECTIONS}

# Enable Play evolutions for database migrations
play.evolutions.enabled=true
play.evolutions.autoApply=false

# Dependency injection modules
play.modules.enabled += "modules.UserServiceModule"
play.modules.enabled += "modules.PrometheusModule"
play.modules.enabled += "modules.ConsulModule"

# Health check
healthcheck.enabled=true

# JWT configuration
jwt.secret="your-jwt-secret-key-change-this-in-production-must-be-secure"
jwt.secret=${?JWT_SECRET}
jwt.expiration.hours=24
jwt.expiration.hours=${?JWT_EXPIRATION_HOURS}

# Allow all hosts for development
play.filters.hosts.allowed = ["."]

# Use custom Filters class that excludes CSRF (JWT-based auth, no cookies)
play.http.filters = "filters.Filters"

# CORS configuration
play.filters.cors {
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
  allowedHttpHeaders = ["Accept", "Authorization", "Content-Type", "X-Requested-With", "Origin"]
  allowCredentials = true
  preflightMaxAge = 3 days
}

# Kafka configuration
kafka.bootstrap.servers="kafka:29092"
kafka.bootstrap.servers=${?KAFKA_BOOTSTRAP_SERVERS}
kafka.topic.domain-events="domain-events"
kafka.topic.domain-events=${?KAFKA_TOPIC_DOMAIN_EVENTS}
kafka.consumer.group-id="user-service-group"
kafka.consumer.group-id=${?KAFKA_CONSUMER_GROUP_ID}

# Consul configuration
consul.host="consul"
consul.host=${?CONSUL_HOST}
consul.port=8500
consul.port=${?CONSUL_PORT}
consul.service.name="user-service"
consul.service.host="user-service"
consul.service.port=9000