User:
  type: object
  required:
    - id
    - email
    - name
    - status
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      description: User ID
      examples:
        - "1"
    email:
      type: string
      format: email
      description: User email address
      examples:
        - john.doe@example.com
    name:
      type: string
      description: User full name
      examples:
        - John Doe
    birthdate:
      oneOf:
        - type: string
          format: date
        - type: "null"
      description: User birthdate
      examples:
        - "1990-01-15"
    status:
      type: integer
      description: User status (0 = Inactive, 1 = Active)
      enum: [0, 1]
      examples:
        - 1
    lastLoginAt:
      oneOf:
        - type: string
          format: date-time
        - type: "null"
      description: Last login timestamp
      examples:
        - "2024-01-15T10:30:00"
    verifiedAt:
      oneOf:
        - type: string
          format: date-time
        - type: "null"
      description: Email verification timestamp
      examples:
        - "2024-01-15T10:30:00"
    createdAt:
      type: string
      format: date-time
      description: Account creation timestamp
      examples:
        - "2024-01-15T10:30:00"
    updatedAt:
      type: string
      format: date-time
      description: Last update timestamp
      examples:
        - "2024-01-15T10:30:00"

CreateUserRequest:
  type: object
  required:
    - email
    - name
  properties:
    email:
      type: string
      format: email
      description: User email address
      examples:
        - john.doe@example.com
    name:
      type: string
      description: User full name
      minLength: 1
      examples:
        - John Doe
    password:
      oneOf:
        - type: string
          format: password
        - type: "null"
      description: User password (optional)
      examples:
        - SecurePass123!
    birthdate:
      oneOf:
        - type: string
          format: date
        - type: "null"
      description: User birthdate (optional)
      examples:
        - "1990-01-15"

UpdateUserRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      description: User full name
      minLength: 1
      examples:
        - John Doe
    birthdate:
      oneOf:
        - type: string
          format: date
        - type: "null"
      description: User birthdate (optional)
      examples:
        - "1990-01-15"

ChangeEmailRequest:
  type: object
  required:
    - email
  properties:
    email:
      type: string
      format: email
      description: New email address
      examples:
        - newemail@example.com

PaginationInfo:
  type: object
  required:
    - page
    - size
    - total
    - totalPages
  properties:
    page:
      type: integer
      description: Current page number (0-indexed)
      examples:
        - 0
    size:
      type: integer
      description: Number of items per page
      examples:
        - 20
    total:
      type: integer
      format: int64
      description: Total number of items
      examples:
        - 100
    totalPages:
      type: integer
      description: Total number of pages
      examples:
        - 5

UserSuccessResponse:
  type: object
  required:
    - success
    - data
    - message
  properties:
    success:
      type: boolean
      examples:
        - true
    data:
      $ref: './schemas.yaml#/User'
    message:
      type: string
      examples:
        - User retrieved successfully

UsersSuccessResponse:
  type: object
  required:
    - success
    - data
    - message
  properties:
    success:
      type: boolean
      examples:
        - true
    data:
      type: array
      items:
        $ref: './schemas.yaml#/User'
    message:
      type: string
      examples:
        - Users retrieved successfully

PaginatedUsersResponse:
  type: object
  required:
    - success
    - data
    - pagination
    - message
  properties:
    success:
      type: boolean
      examples:
        - true
    data:
      type: array
      items:
        $ref: './schemas.yaml#/User'
    pagination:
      $ref: './schemas.yaml#/PaginationInfo'
    message:
      type: string
      examples:
        - Users retrieved successfully

ErrorResponse:
  type: object
  required:
    - success
    - error
    - code
  properties:
    success:
      type: boolean
      examples:
        - false
    error:
      type: string
      description: Error message
      examples:
        - User not found
    code:
      type: string
      description: Error code
      enum:
        - VALIDATION_ERROR
        - NOT_FOUND
        - INVALID_OPERATION
        - DUPLICATE_ERROR
        - INTERNAL_ERROR
        - USER_NOT_FOUND
      examples:
        - USER_NOT_FOUND

# Authentication Schemas
LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      description: User email address
      examples:
        - admin@gmail.com
    password:
      type: string
      format: password
      description: User password
      minLength: 6
      examples:
        - Admin@123

LoginData:
  type: object
  required:
    - user
    - token
    - expiresAt
  properties:
    user:
      $ref: './schemas.yaml#/User'
    token:
      type: string
      description: JWT access token
      examples:
        - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwiZW1haWwiOiJhZG1pbkBnbWFpbC5jb20iLCJpYXQiOjE3NjA0OTM4ODIsImV4cCI6MTc2MDU4MDI4Mn0.JoVgK8xIwBniSMIyr8S4wl4-yC86VKJBfixa-hIs2WQ
    expiresAt:
      type: string
      format: date-time
      description: Token expiration timestamp
      examples:
        - "2025-10-16T02:04:42.036492423"

ChangePasswordRequest:
  type: object
  required:
    - oldPassword
    - newPassword
  properties:
    oldPassword:
      type: string
      format: password
      description: Current password
      minLength: 6
      examples:
        - OldPassword123!
    newPassword:
      type: string
      format: password
      description: New password
      minLength: 6
      examples:
        - NewPassword123!

ForgotPasswordRequest:
  type: object
  required:
    - email
  properties:
    email:
      type: string
      format: email
      description: User email address
      examples:
        - admin@gmail.com
    resetUrl:
      oneOf:
        - type: string
          format: uri
        - type: "null"
      description: Custom reset URL (optional, defaults to http://localhost:3000/reset-password)
      examples:
        - https://myapp.com/reset-password

ResetPasswordRequest:
  type: object
  required:
    - token
    - newPassword
  properties:
    token:
      type: string
      description: Password reset token received via email
      examples:
        - fFzw791jCP_vfVFn_NNj5DF68pw9egrkbeKTTIWaW-c
    newPassword:
      type: string
      format: password
      description: New password
      minLength: 6
      examples:
        - NewPassword123!
