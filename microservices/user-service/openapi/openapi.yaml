openapi: 3.1.0
info:
  title: User Service API
  description: User management microservice
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:9001
    description: User Service (direct)
  - url: http://localhost:9000/api
    description: API Gateway

tags:
  - name: users
    description: User management endpoints
  - name: health
    description: Health check endpoints
  - name: authentication
    description: Authentication and authorization endpoints
  - name: password-management
    description: Password change and reset operations

paths:
  /health:
    $ref: './paths/health.yaml'

  # User Management
  /api/users:
    $ref: './paths/users.yaml#/~1api~1users'

  /api/users/paginated:
    $ref: './paths/users.yaml#/~1api~1users~1paginated'

  /api/users/{id}:
    $ref: './paths/users.yaml#/~1api~1users~1{id}'

  /api/users/by-email/{email}:
    $ref: './paths/users.yaml#/~1api~1users~1by-email~1{email}'

  /api/users/{id}/email:
    $ref: './paths/users.yaml#/~1api~1users~1{id}~1email'

  # Authentication
  /api/auth/login:
    $ref: './paths/auth.yaml#/~1api~1auth~1login'

  /api/auth/verify:
    $ref: './paths/auth.yaml#/~1api~1auth~1verify'

  /api/auth/refresh:
    $ref: './paths/auth.yaml#/~1api~1auth~1refresh'

  /api/auth/logout:
    $ref: './paths/auth.yaml#/~1api~1auth~1logout'

  /api/auth/change-password:
    $ref: './paths/auth.yaml#/~1api~1auth~1change-password'

  /api/auth/forgot-password:
    $ref: './paths/auth.yaml#/~1api~1auth~1forgot-password'

  /api/auth/reset-password:
    $ref: './paths/auth.yaml#/~1api~1auth~1reset-password'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    # User Management
    User:
      $ref: './components/schemas.yaml#/User'
    CreateUserRequest:
      $ref: './components/schemas.yaml#/CreateUserRequest'
    UpdateUserRequest:
      $ref: './components/schemas.yaml#/UpdateUserRequest'
    ChangeEmailRequest:
      $ref: './components/schemas.yaml#/ChangeEmailRequest'
    PaginationInfo:
      $ref: './components/schemas.yaml#/PaginationInfo'
    UserSuccessResponse:
      $ref: './components/schemas.yaml#/UserSuccessResponse'
    UsersSuccessResponse:
      $ref: './components/schemas.yaml#/UsersSuccessResponse'
    PaginatedUsersResponse:
      $ref: './components/schemas.yaml#/PaginatedUsersResponse'
    ErrorResponse:
      $ref: './components/schemas.yaml#/ErrorResponse'

    # Authentication
    LoginRequest:
      $ref: './components/schemas.yaml#/LoginRequest'
    LoginData:
      $ref: './components/schemas.yaml#/LoginData'
    ChangePasswordRequest:
      $ref: './components/schemas.yaml#/ChangePasswordRequest'
    ForgotPasswordRequest:
      $ref: './components/schemas.yaml#/ForgotPasswordRequest'
    ResetPasswordRequest:
      $ref: './components/schemas.yaml#/ResetPasswordRequest'

  responses:
    # User Management
    GetUserResponse:
      $ref: './components/responses.yaml#/UserSuccessResponse'
    GetUsersResponse:
      $ref: './components/responses.yaml#/UsersSuccessResponse'
    GetUsersPaginatedResponse:
      $ref: './components/responses.yaml#/PaginatedUsersResponse'
    CreateUserResponse:
      $ref: './components/responses.yaml#/UserCreatedResponse'
    DeleteUserResponse:
      $ref: './components/responses.yaml#/UserDeletedResponse'

    # Authentication
    LoginSuccessResponse:
      $ref: './components/responses.yaml#/LoginSuccessResponse'
    VerifyTokenResponse:
      $ref: './components/responses.yaml#/VerifyTokenResponse'
    LogoutSuccessResponse:
      $ref: './components/responses.yaml#/LogoutSuccessResponse'
    ChangePasswordSuccessResponse:
      $ref: './components/responses.yaml#/ChangePasswordSuccessResponse'
    ForgotPasswordSuccessResponse:
      $ref: './components/responses.yaml#/ForgotPasswordSuccessResponse'
    ResetPasswordSuccessResponse:
      $ref: './components/responses.yaml#/ResetPasswordSuccessResponse'

    # Error Responses
    BadRequestErrorResponse:
      $ref: './components/responses.yaml#/BadRequestError'
    UnauthorizedErrorResponse:
      $ref: './components/responses.yaml#/UnauthorizedError'
    NotFoundErrorResponse:
      $ref: './components/responses.yaml#/NotFoundError'
    ConflictErrorResponse:
      $ref: './components/responses.yaml#/ConflictError'
    InternalServerErrorResponse:
      $ref: './components/responses.yaml#/InternalServerError'

    # Health Check
    HealthCheckApiResponse:
      $ref: './components/responses.yaml#/HealthCheckResponse'

  parameters:
    UserId:
      $ref: './components/parameters.yaml#/UserId'
    UserEmail:
      $ref: './components/parameters.yaml#/UserEmail'
    LimitQuery:
      $ref: './components/parameters.yaml#/LimitQuery'
    PageQuery:
      $ref: './components/parameters.yaml#/PageQuery'
    SizeQuery:
      $ref: './components/parameters.yaml#/SizeQuery'
    SearchQuery:
      $ref: './components/parameters.yaml#/SearchQuery'
    OrderByQuery:
      $ref: './components/parameters.yaml#/OrderByQuery'
    OrderDirectionQuery:
      $ref: './components/parameters.yaml#/OrderDirectionQuery'
    IgnoreIdQuery:
      $ref: './components/parameters.yaml#/IgnoreIdQuery'
    StatusQuery:
      $ref: './components/parameters.yaml#/StatusQuery'
    CreatedFromQuery:
      $ref: './components/parameters.yaml#/CreatedFromQuery'
    CreatedToQuery:
      $ref: './components/parameters.yaml#/CreatedToQuery'
